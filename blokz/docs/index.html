<!DOCTYPE html>

    :root { color-scheme: light; --bg:#e8eae8; --fg:#141816; --accent:#c45c1a; --card:#f4f5f3; --border:#cfd4cf; }

    a.btn { display:block; text-align:center; text-decoration:none; background:var(--accent); color:#fff; font-weight:600;
      padding:12px 16px; border-radius:10px; margin-bottom:10px; }
    a.btn.secondary { background:transparent; color:var(--fg); border:1px solid var(--border); }
    .logo { font-weight:800; letter-spacing:0.08em; color:var(--accent); margin-bottom:12px; }
